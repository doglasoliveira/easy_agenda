<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcações</title>
<style>
  :root {
    --bg: #faf7f4; --card: #fff; --ink: #1f1b18; --muted: #6f655d; --line: #e8e0d8;
    --accent: #b5527a; --accent-ink: #fff; --accent-soft: #f6e6ed; --ok: #1a7f4b; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171412; --card: #221e1b; --ink: #f3ede8; --muted: #a89c92; --line: #3a332e;
      --accent: #e08aad; --accent-ink: #1a1214; --accent-soft: #3a2630; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .demo { background: #fff4d6; color: #6b4e00; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 16px 0 0; }
  .steps { display: flex; gap: 6px; margin: 20px 0 16px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .steps span.on { background: var(--accent); }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .back { background: none; border: 0; color: var(--muted); padding: 0; margin: 0 0 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .list { display: grid; gap: 10px; }
  .item { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; width: 100%;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    font: inherit; cursor: pointer; transition: border-color .15s, transform .05s; }
  .item:hover { border-color: var(--accent); }
  .item:active { transform: scale(.99); }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item .tag { white-space: nowrap; font-weight: 600; color: var(--accent); font-size: 14px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; }
  .day { flex: 0 0 64px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 0; text-align: center; font: inherit; color: var(--ink); cursor: pointer; }
  .day b { display: block; font-size: 20px; }
  .day small { color: var(--muted); font-size: 12px; text-transform: capitalize; }
  .day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .day.sel small { color: var(--accent-ink); }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 8px; }
  .time { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; font: inherit;
    color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
  .time:hover { border-color: var(--accent); background: var(--accent-soft); }
  .note { color: var(--muted); font-size: 14px; padding: 12px 0; }
  .summary { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hp { position: absolute; left: -9999px; }
  .primary { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--err); font-size: 14px; margin-top: 10px; }
  .done { text-align: center; padding: 24px 0; }
  .done .icon { font-size: 48px; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="studio">Marcações</h1>
    <p id="address"></p>
  </header>
  <div id="demo" class="demo" hidden>Modo demonstração: cola o URL do Apps Script em <code>API_URL</code> para ligar ao Google Calendar.</div>
  <div class="steps" id="steps"><span></span><span></span><span></span><span></span></div>
  <main id="app"><div class="spinner"></div></main>
</div>

<script>
/* ======== CONFIGURAÇÃO: cola aqui o URL da implementação do Apps Script (termina em /exec) ======== */
const API_URL = '';
/* ================================================================================================= */

const $app = document.getElementById('app');
const state = { config: null, service: null, pro: null, date: null, time: null };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtPrice = v => typeof v === 'number'
  ? (v ? new Intl.NumberFormat('pt-PT', { style: 'currency', currency: state.config?.currency || 'EUR' }).format(v) : '')
  : (v || '');
const fmtLong = s => { const [y, m, d] = s.split('-').map(Number);
  return new Intl.DateTimeFormat('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(y, m - 1, d)); };

/* ---------- API ---------- */
async function api(params) {
  if (!API_URL) return demoApi(params);
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
async function postBooking(data) {
  if (!API_URL) { await sleep(700); return { ok: true, status: 'pending' }; }
  // text/plain evita o pedido "preflight" de CORS, que o Apps Script não suporta
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'book', ...data }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

/* ---------- Dados de demonstração (só quando API_URL está vazio) ---------- */
const DEMO = {
  studio: 'Estúdio Exemplo', address: 'Rua Exemplo 123, Lisboa', timeZone: 'Europe/Lisbon', maxDays: 30, currency: 'EUR', closedDates: [],
  services: [
    { id: 'manicure', name: 'Manicure', duration: 45, price: 15, description: 'Limpeza, cutículas e verniz.' },
    { id: 'gel', name: 'Unhas de gel', duration: 90, price: 35, description: 'Aplicação ou manutenção.' },
    { id: 'guitarra', name: 'Aula de guitarra', duration: 60, price: 25, description: 'Aula individual, todos os níveis.' },
  ],
  professionals: [
    { id: 'ana', name: 'Ana Silva', role: 'Manicure', services: ['manicure', 'gel'], days: [2, 3, 4, 5, 6] },
    { id: 'marta', name: 'Marta Lopes', role: 'Manicure', services: ['manicure'], days: [1, 3, 5] },
    { id: 'rui', name: 'Rui Costa', role: 'Professor de música', services: ['guitarra'], days: [1, 3, 5, 6] },
  ],
};
async function demoApi(p) {
  await sleep(300);
  if (p.action === 'config') return DEMO;
  const seed = [...p.date + p.pro].reduce((a, c) => a + c.charCodeAt(0), 0);
  const all = ['09:00', '09:45', '10:30', '11:15', '12:00', '14:00', '14:45', '15:30', '16:15', '17:00', '17:45'];
  return { slots: all.filter((_, i) => (seed + i * 7) % 3 !== 0) };
}

/* ---------- UI ---------- */
function setStep(n) {
  document.querySelectorAll('#steps span').forEach((s, i) => s.classList.toggle('on', i < n));
}
function backBtn(fn) {
  const b = document.createElement('button');
  b.className = 'back'; b.textContent = '← Voltar'; b.onclick = fn;
  return b;
}

function renderServices() {
  setStep(1);
  const c = state.config;
  $app.innerHTML = `<h2>Escolhe o serviço</h2><div class="list">${c.services.map(s => `
    <button class="item" data-id="${esc(s.id)}">
      <span>${esc(s.name)}<small>${esc(s.duration)} min${s.description ? ' · ' + esc(s.description) : ''}</small></span>
      <span class="tag">${esc(fmtPrice(s.price))}</span>
    </button>`).join('')}</div>`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    state.service = c.services.find(s => s.id === b.dataset.id);
    const pros = c.professionals.filter(p => p.services.includes(state.service.id));
    if (pros.length === 1) { state.pro = pros[0]; renderDate(); } else renderPros();
  });
}

function renderPros() {
  setStep(2);
  const pros = state.config.professionals.filter(p => p.services.includes(state.service.id));
  $app.innerHTML = `<h2>Com quem?</h2><div class="list">${pros.map(p => `
    <button class="item" data-id="${esc(p.id)}"><span>${esc(p.name)}<small>${esc(p.role)}</small></span><span class="tag">→</span></button>`).join('')}</div>`;
  $app.prepend(backBtn(renderServices));
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    state.pro = pros.find(p => p.id === b.dataset.id);
    renderDate();
  });
}

function renderDate() {
  setStep(3);
  const days = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i < state.config.maxDays && days.length < 30; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    if (state.pro.days.includes(d.getDay()) && !(state.config.closedDates || []).includes(isoDate(d))) days.push(d);
  }
  const wd = new Intl.DateTimeFormat('pt-PT', { weekday: 'short' });
  const mo = new Intl.DateTimeFormat('pt-PT', { month: 'short' });
  $app.innerHTML = `<h2>Dia e hora</h2>
    <div class="summary">${esc(state.service.name)} · ${esc(state.pro.name)}</div>
    <div class="days">${days.map(d => `<button class="day" data-date="${isoDate(d)}">
      <small>${wd.format(d).replace('.', '')}</small><b>${d.getDate()}</b><small>${mo.format(d).replace('.', '')}</small></button>`).join('')}</div>
    <div id="times"><p class="note">${days.length ? 'Escolhe um dia.' : 'Sem dias disponíveis.'}</p></div>`;
  const pros = state.config.professionals.filter(p => p.services.includes(state.service.id));
  $app.prepend(backBtn(pros.length > 1 ? renderPros : renderServices));
  $app.querySelectorAll('.day').forEach(b => b.onclick = () => {
    $app.querySelectorAll('.day').forEach(x => x.classList.toggle('sel', x === b));
    state.date = b.dataset.date;
    loadTimes();
  });
  const first = $app.querySelector('.day');
  if (first) first.click();
}

async function loadTimes() {
  const box = document.getElementById('times');
  const date = state.date;
  box.innerHTML = '<div class="spinner"></div>';
  try {
    const { slots } = await api({ action: 'slots', pro: state.pro.id, service: state.service.id, date });
    if (date !== state.date) return; // o utilizador entretanto mudou de dia
    box.innerHTML = slots.length
      ? `<p class="note" style="padding:4px 0 0">${esc(fmtLong(date))}</p><div class="times">${slots.map(t => `<button class="time">${esc(t)}</button>`).join('')}</div>`
      : `<p class="note">Sem horários livres neste dia. Experimenta outro.</p>`;
    box.querySelectorAll('.time').forEach(b => b.onclick = () => { state.time = b.textContent; renderForm(); });
  } catch (e) {
    box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

function renderForm() {
  setStep(4);
  $app.innerHTML = `<h2>Os teus dados</h2>
    <div class="summary"><b>${esc(state.service.name)}</b> com ${esc(state.pro.name)}<br>${esc(fmtLong(state.date))} às ${esc(state.time)}</div>
    <form id="f" novalidate>
      <label for="name">Nome</label><input id="name" name="name" autocomplete="name" required maxlength="80">
      <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="120">
      <label for="phone">Telemóvel</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30">
      <label for="notes">Notas (opcional)</label><textarea id="notes" name="notes" rows="3" maxlength="500"></textarea>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="primary" type="submit">Pedir marcação</button>
      <p class="error" id="err" hidden></p>
    </form>`;
  $app.prepend(backBtn(renderDate));
  const f = document.getElementById('f');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById('err');
    const data = Object.fromEntries(new FormData(f));
    err.hidden = true;
    if (!data.name.trim()) return showErr('Indica o teu nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showErr('Indica um e-mail válido.');
    const btn = f.querySelector('.primary');
    btn.disabled = true; btn.textContent = 'A enviar…';
    try {
      const res = await postBooking({ ...data, pro: state.pro.id, service: state.service.id, date: state.date, time: state.time });
      renderDone(data, res.status === 'confirmed');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Pedir marcação';
      showErr(e.message);
    }
    function showErr(m) { err.textContent = m; err.hidden = false; }
  };
}

function renderDone(data, confirmed) {
  setStep(4);
  $app.innerHTML = confirmed ? `<div class="done"><div class="icon">✅</div>
    <h2>Marcação confirmada!</h2>
    <p>${esc(state.service.name)} com ${esc(state.pro.name)}<br><b>${esc(fmtLong(state.date))} às ${esc(state.time)}</b></p>
    <p class="note">Enviámos a confirmação para <b>${esc(data.email)}</b>, com um botão para o Google Calendar e um ficheiro para o calendário do iPhone.</p>
    <button class="primary" id="again">Fazer outra marcação</button></div>` : `<div class="done"><div class="icon">📩</div>
    <h2>Pedido enviado!</h2>
    <p>${esc(state.service.name)} com ${esc(state.pro.name)}<br><b>${esc(fmtLong(state.date))} às ${esc(state.time)}</b></p>
    <p class="note">O horário fica reservado enquanto o estúdio confirma. Vais receber a confirmação em <b>${esc(data.email)}</b>, com um botão para o Google Calendar e um ficheiro para o calendário do iPhone.</p>
    <button class="primary" id="again">Fazer outra marcação</button></div>`;
  document.getElementById('again').onclick = () => { Object.assign(state, { service: null, pro: null, date: null, time: null }); renderServices(); };
}

/* ---------- Arranque ---------- */
(async () => {
  document.getElementById('demo').hidden = !!API_URL;
  try {
    state.config = await api({ action: 'config' });
    document.getElementById('studio').textContent = state.config.studio;
    document.getElementById('address').textContent = state.config.address || '';
    document.title = 'Marcações · ' + state.config.studio;
    renderServices();
  } catch (e) {
    $app.innerHTML = `<p class="error">Não foi possível carregar a agenda. ${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
