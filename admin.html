<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do Estúdio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb; --dot: #e3e8f3; --card: #fff; --ink: #2b2d42; --muted: #7a7f99; --line: #e6e9f2; --soft: #f4f6fb;
    --accent: #ff5c5c; --accent-dark: #d63c4a; --accent-ink: #fff; --accent-soft: #ffe8e8;
    --c1: #ff7a45; --c2: #18b8a5; --c3: #3d8bff; --c4: #ffb703; --c5: #a35cff; --c6: #ff4d8d;
    --ok: #0f9a72; --ok-soft: #dcf6ec; --warn: #b07800; --warn-soft: #fff1c9;
    --info: #2f6fdc; --info-soft: #e2edff; --err: #e5383b; --err-soft: #ffe3e3; --grey-soft: #eceff6;
    --shadow: 0 5px 0 rgba(43, 45, 66, .06), 0 10px 26px rgba(43, 45, 66, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1d2b; --dot: #25283a; --card: #262939; --ink: #f2f3fa; --muted: #a3a8c3; --line: #353950; --soft: #1f2232;
      --accent-soft: #3d2730; --ok: #4fd6a5; --ok-soft: #173a2f; --warn: #ffcc4d; --warn-soft: #3b3115;
      --info: #8db4ff; --info-soft: #1d2a48; --err: #ff7b7d; --err-soft: #432126; --grey-soft: #30344a;
      --shadow: 0 5px 0 rgba(0, 0, 0, .25), 0 10px 26px rgba(0, 0, 0, .25); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 600 15px/1.45 "Nunito", system-ui, sans-serif;
    background: var(--bg) radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0 / 22px 22px; min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; letter-spacing: -.01em; font-weight: 900; }
  h2 { font-size: 24px; }
  h3 { font-size: 17px; margin-bottom: 12px; }
  a { color: var(--accent); font-weight: 800; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login form { width: 100%; max-width: 380px; background: var(--card); border-radius: 30px; padding: 30px 26px; box-shadow: var(--shadow); text-align: center; }
  .login form .field { text-align: left; }
  .login h1 { font-size: 26px; margin-bottom: 4px; }
  .login .logo { margin: 0 auto 10px; width: 72px; height: 72px; font-size: 36px; border-radius: 24px; }

  /* topo */
  .logo { width: 46px; height: 46px; border-radius: 16px; background: var(--accent); display: grid; place-items: center; font-size: 23px;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .15); flex: none; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; max-width: 1120px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .top h1 { font-size: 21px; }
  .top a { font-size: 13px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; max-width: 1120px; margin: 0 auto; scrollbar-width: none; }
  .tabs button { background: var(--card); border: 0; border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 800; color: var(--muted);
    cursor: pointer; white-space: nowrap; box-shadow: 0 4px 0 var(--line); transition: transform .1s; }
  .tabs button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
  .tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--c4); color: #3a2a00;
    font-size: 12px; font-weight: 900; text-align: center; line-height: 20px; animation: pulse 2s ease-in-out infinite; }
  main { max-width: 1120px; margin: 0 auto; padding: 12px 16px 80px; display: grid; gap: 16px; animation: pop .35s cubic-bezier(.34, 1.56, .64, 1); }
  .demo { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 13px; font-weight: 800; padding: 8px 16px; }

  .card { background: var(--card); border-radius: 24px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* formulários */
  .field { display: grid; gap: 5px; min-width: 0; }
  .field label, .lbl { font-size: 13px; font-weight: 800; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 14px; border: 3px solid var(--line); background: var(--soft); color: var(--ink);
    font-size: 15px; font-weight: 700; min-width: 0; transition: border-color .15s, background .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--c3); background: var(--card); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  .field label.check { font-weight: 700; color: var(--ink); font-size: 15px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0; }
  .checks .check { background: var(--soft); border: 3px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; }
  .checks .check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stack { display: grid; gap: 14px; }
  .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inline input { width: auto; flex: 1 1 160px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 14px; border: 0;
    background: var(--card); color: var(--ink); font-size: 15px; font-weight: 800; cursor: pointer; white-space: nowrap; text-decoration: none;
    box-shadow: 0 4px 0 var(--line), inset 0 0 0 2px var(--line); transition: transform .1s, box-shadow .1s; }
  .btn:hover { filter: brightness(1.03); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
  .btn.primary:active { box-shadow: 0 1px 0 var(--accent-dark); }
  .btn.ok { background: var(--ok); color: #fff; box-shadow: 0 4px 0 #0a7254; }
  .btn.ok:active { box-shadow: 0 1px 0 #0a7254; }
  .btn.danger { color: var(--err); }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 12px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 14px; font-weight: 800; }

  /* indicadores */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .kpi { --c: var(--c1); background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .kpi::after { content: attr(data-icon); position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 13px; background: var(--c);
    display: grid; place-items: center; font-size: 19px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14); }
  .kpi span { display: block; font-size: 13px; color: var(--muted); font-weight: 800; padding-right: 44px; }
  .kpi b { display: block; font-size: 28px; font-weight: 900; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .kpi small { color: var(--muted); font-size: 12px; font-weight: 700; }

  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .bars { display: grid; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 14px; font-weight: 800; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 14px; border-radius: 8px; background: var(--grey-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 8px; background: var(--accent); transform-origin: left; animation: grow .7s cubic-bezier(.34, 1.56, .64, 1); }
  .bar-row:nth-child(6n+2) .bar i { background: var(--c2); } .bar-row:nth-child(6n+3) .bar i { background: var(--c3); }
  .bar-row:nth-child(6n+4) .bar i { background: var(--c4); } .bar-row:nth-child(6n+5) .bar i { background: var(--c5); }
  .bar-row:nth-child(6n) .bar i { background: var(--c1); }
  .bar-row .val { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .bar-row .val small { color: var(--muted); }
  .chart svg { width: 100%; height: auto; max-height: 260px; display: block; }
  .chart .lbl-axis { fill: var(--muted); font-size: 10px; font-weight: 700; }
  .chart rect.col { fill: var(--c3); }
  .chart rect.col:hover { fill: var(--accent); }

  /* tabelas */
  .table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 800; padding: 8px 10px; border-bottom: 3px solid var(--line); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 2px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--soft); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; white-space: nowrap; }
  .b-pending { background: var(--warn-soft); color: var(--warn); }
  .b-confirmed { background: var(--info-soft); color: var(--info); }
  .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-noshow { background: var(--err-soft); color: var(--err); }
  .b-off { background: var(--grey-soft); color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; font-weight: 800; }
  .chip button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; font-size: 16px; line-height: 1; font-weight: 900; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* marcações */
  .bk-list { display: grid; gap: 10px; margin-top: 12px; }
  .bk { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--soft); }
  .bk-when { background: var(--card); border-radius: 14px; padding: 6px 0; text-align: center; box-shadow: 0 3px 0 var(--line); }
  .bk-when b { display: block; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .bk-when small { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: capitalize; }
  .bk-main { min-width: 0; }
  .bk-main small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .bk-act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 560px) { .bk { grid-template-columns: 62px 1fr; } .bk-act { grid-column: 1 / -1; justify-content: flex-start; } }

  /* profissionais */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .avatar { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 18px;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14); flex: none; }
  .pro-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .pro h3 { margin: 0; font-size: 18px; }
  .pro .hours { font-size: 13px; color: var(--muted); margin: 12px 0; display: grid; gap: 3px; }
  .pro .hours b { color: var(--ink); font-weight: 900; display: inline-block; width: 36px; }
  .svc-ico { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; font-size: 18px; margin-right: 8px; vertical-align: middle;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }

  .hours-edit { display: grid; gap: 8px; }
  .hours-edit .hr { display: grid; grid-template-columns: 80px 1fr; gap: 10px; align-items: center; }
  .hours-edit .hr span { font-size: 14px; font-weight: 800; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-pick button { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--line); background: var(--soft); font-size: 20px; cursor: pointer; }
  .emoji-pick button.on { border-color: var(--accent); background: var(--accent-soft); }

  dialog { border: 0; border-radius: 28px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--card); color: var(--ink);
    box-shadow: 0 8px 0 rgba(0, 0, 0, .08), 0 30px 60px rgba(0, 0, 0, .25); }
  dialog[open] { animation: pop .3s cubic-bezier(.34, 1.56, .64, 1); }
  dialog::backdrop { background: rgba(27, 29, 43, .5); }
  dialog form { padding: 24px; display: grid; gap: 14px; }
  dialog h3 { font-size: 21px; margin: 0; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 16px;
    font-size: 15px; font-weight: 800; max-width: calc(100vw - 32px); box-shadow: 0 6px 0 rgba(0, 0, 0, .15); z-index: 10; animation: toastIn .35s cubic-bezier(.34, 1.56, .64, 1); }
  .toast.bad { background: var(--err); color: #fff; }
  .dots { display: flex; justify-content: center; gap: 8px; padding: 26px 0; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: hop .9s ease-in-out infinite; }
  .dots i:nth-child(2) { background: var(--c4); animation-delay: .15s; }
  .dots i:nth-child(3) { background: var(--c2); animation-delay: .3s; }
  .empty { color: var(--muted); font-size: 15px; font-weight: 700; padding: 8px 0; }

  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="demoBanner" class="demo" hidden>🧪 Modo demonstração com dados fictícios. Cola o URL do Apps Script em <code>API_URL</code> para ligar ao estúdio real.</div>

<div id="login" class="login" hidden>
  <form id="loginForm" class="stack">
    <div>
      <div class="logo" aria-hidden="true">📅</div>
      <h1>Olá! 👋</h1>
      <p class="muted small" style="margin:4px 0 0">Entra com a senha de administração.</p>
    </div>
    <div class="field"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="err" id="loginErr" hidden></p>
  </form>
</div>

<div id="shell" hidden>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">📅</div>
      <div><h1 id="studioName">Painel</h1>
      <a id="siteLink" target="_blank" rel="noopener" hidden>Ver site de marcações ↗</a></div>
    </div>
    <button class="btn sm" id="logout">Sair</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="reports">📊 Relatórios</button>
    <button data-tab="bookings">🗓️ Marcações <span class="count" id="pendingCount" hidden></span></button>
    <button data-tab="pros">🙋 Profissionais</button>
    <button data-tab="services">✨ Serviços</button>
    <button data-tab="blocks">🏖️ Folgas</button>
    <button data-tab="settings">⚙️ Definições</button>
  </nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><form id="dlgForm" novalidate></form></dialog>
<div id="toast" class="toast" hidden></div>

<script>
/* ======== CONFIGURAÇÃO: o mesmo URL do Apps Script usado no index.html (termina em /exec) ======== */
const API_URL = '';
/* ================================================================================================ */

const DEMO_MODE = !API_URL;
const session = {
  get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { sessionStorage.removeItem(k); } catch (e) {} },
};

let TOKEN = session.get('agenda_token');
let DATA = null;
let TAB = 'reports';

/* ---------- utilitários ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const money = n => new Intl.NumberFormat('pt-PT', { style: 'currency', currency: DATA?.settings?.currency || 'EUR' }).format(n || 0);
const fmtDay = s => new Intl.DateTimeFormat('pt-PT', { weekday: 'short', day: '2-digit', month: 'short' }).format(parseISO(s)).replace(/\./g, '');
const fmtDayLong = s => new Intl.DateTimeFormat('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(parseISO(s));
const WD = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const WD_SHORT = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const ORDER = [1, 2, 3, 4, 5, 6, 0];
const STATUS = { pending: 'Pendente', confirmed: 'Confirmado', done: 'Realizado', noshow: 'Faltou' };
const badge = s => `<span class="badge b-${s}">${STATUS[s] || esc(s)}</span>`;
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const svcName = id => DATA.services.find(s => s.id === id)?.name || id;
const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
const colorOf = (list, id) => COLORS[Math.max(0, list.findIndex(x => x.id === id)) % COLORS.length];
const ICONS = [
  [/pedicure|p[ée]s/i, '🦶'], [/manicure|unha|gel|verniz/i, '💅'], [/guitarra|viol[aã]o|ukulele/i, '🎸'], [/piano|teclado/i, '🎹'],
  [/bateria|percuss/i, '🥁'], [/violino|violoncelo/i, '🎻'], [/canto|voz|vocal/i, '🎤'], [/sax|flauta|trompete/i, '🎷'],
  [/cabelo|corte|barba|barbear/i, '✂️'], [/massag/i, '💆'], [/sobrancelha|pestana|c[ií]lio/i, '👁️'], [/maquilh|make/i, '💄'],
  [/depila/i, '🌸'], [/facial|pele/i, '🧖'], [/yoga|pilates|treino|personal/i, '🧘'], [/aula|explica|curso/i, '📚'],
];
const EMOJIS = ['💅', '🦶', '✂️', '💆', '💄', '🧖', '🌸', '👁️', '🎸', '🎹', '🥁', '🎻', '🎤', '🎷', '📚', '🧘', '🎨', '✨'];
const iconOf = s => s.icon || (ICONS.find(([re]) => re.test(s.name + ' ' + (s.description || ''))) || [0, '✨'])[1];
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const svcIco = s => `<span class="svc-ico" style="background:${colorOf(DATA.services, s.id)}">${iconOf(s)}</span>`;

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), bad ? 5000 : 2800);
}

async function call(op, params = {}) {
  if (DEMO_MODE) return demoCall(op, JSON.parse(JSON.stringify(params)));
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita o preflight de CORS
    body: JSON.stringify({ action: 'admin', op, token: TOKEN, ...params }),
  });
  const j = await r.json();
  if (j.error) { if (j.auth) logout(j.error); throw new Error(j.error); }
  return j;
}

/* =============================== RELATÓRIOS =============================== */
const R = { limit: 50, period: 'month', from: '', to: '', pro: '', service: '', status: '', rows: null, key: '' };

function periodRange(p) {
  const t = today(), y = t.getFullYear(), m = t.getMonth();
  return {
    month: [new Date(y, m, 1), new Date(y, m + 1, 0)],
    lastmonth: [new Date(y, m - 1, 1), new Date(y, m, 0)],
    '7': [addDays(t, -6), t],
    '30': [addDays(t, -29), t],
    '90': [addDays(t, -89), t],
    year: [new Date(y, 0, 1), new Date(y, 11, 31)],
  }[p];
}

function renderReports(el) {
  if (R.period !== 'custom') { const [a, b] = periodRange(R.period); R.from = iso(a); R.to = iso(b); }
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  el.innerHTML = `
    <section class="card">
      <div class="grid-auto">
        <div class="field"><label for="fPeriod">Período</label><select id="fPeriod">
          ${opt('month', 'Este mês', R.period)}${opt('lastmonth', 'Mês passado', R.period)}${opt('7', 'Últimos 7 dias', R.period)}
          ${opt('30', 'Últimos 30 dias', R.period)}${opt('90', 'Últimos 90 dias', R.period)}${opt('year', 'Este ano', R.period)}${opt('custom', 'Personalizado…', R.period)}
        </select></div>
        <div class="field" data-custom><label for="fFrom">De</label><input type="date" id="fFrom" value="${R.from}"></div>
        <div class="field" data-custom><label for="fTo">Até</label><input type="date" id="fTo" value="${R.to}"></div>
        <div class="field"><label for="fPro">Profissional</label><select id="fPro">${opt('', 'Todos', R.pro)}
          ${DATA.professionals.map(p => opt(p.id, p.name + (p.active === false ? ' (inativo)' : ''), R.pro)).join('')}</select></div>
        <div class="field"><label for="fSvc">Serviço</label><select id="fSvc">${opt('', 'Todos', R.service)}
          ${DATA.services.map(s => opt(s.id, s.name + (s.active === false ? ' (inativo)' : ''), R.service)).join('')}</select></div>
        <div class="field"><label for="fStatus">Estado (tabela)</label><select id="fStatus">${opt('', 'Todos', R.status)}
          ${Object.entries(STATUS).map(([k, l]) => opt(k, l, R.status)).join('')}</select></div>
      </div>
    </section>
    <div id="repBody" class="stack"><div class="dots"><i></i><i></i><i></i></div></div>`;

  $$('[data-custom]').forEach(x => (x.hidden = R.period !== 'custom'));
  $('#fPeriod').onchange = e => { R.period = e.target.value; renderReports(el); };
  $('#fFrom').onchange = e => { R.from = e.target.value; loadReport(); };
  $('#fTo').onchange = e => { R.to = e.target.value; loadReport(); };
  R.limit = 50;
  $('#fPro').onchange = e => { R.pro = e.target.value; drawReport(); };
  $('#fSvc').onchange = e => { R.service = e.target.value; drawReport(); };
  $('#fStatus').onchange = e => { R.status = e.target.value; drawReport(); };
  loadReport();
}

async function loadReport() {
  if (!R.from || !R.to || R.from > R.to) { $('#repBody').innerHTML = '<p class="err">Escolhe um período válido.</p>'; return; }
  const key = R.from + '|' + R.to;
  if (R.key === key && R.rows) return drawReport();
  $('#repBody').innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  try {
    const { rows } = await call('listBookings', { from: R.from, to: R.to });
    R.rows = rows; R.key = key;
    drawReport();
  } catch (e) { $('#repBody').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

function groupBy(rows, keyFn, labelFn) {
  const m = new Map();
  rows.forEach(r => {
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, { label: labelFn(r), count: 0, revenue: 0 });
    const g = m.get(k); g.count++; g.revenue += +r.price || 0;
  });
  return [...m.values()].sort((a, b) => b.revenue - a.revenue || b.count - a.count);
}

function barsHTML(groups) {
  if (!groups.length) return '<p class="empty">Sem serviços realizados neste período.</p>';
  const max = Math.max(...groups.map(g => g.revenue), 1);
  return `<div class="bars">${groups.map(g => `
    <div class="bar-row"><span class="name" title="${esc(g.label)}">${esc(g.label)}</span>
      <div class="bar"><i style="width:${Math.max(2, (g.revenue / max) * 100)}%"></i></div>
      <span class="val">${money(g.revenue)} <small>· ${g.count}</small></span></div>`).join('')}</div>`;
}

function timelineHTML(done) {
  const from = parseISO(R.from), to = parseISO(R.to);
  const days = Math.round((to - from) / 864e5) + 1;
  const mode = days <= 35 ? 'day' : days <= 190 ? 'week' : 'month';
  const keyOf = d => {
    if (mode === 'day') return iso(d);
    if (mode === 'week') { const x = addDays(d, -((d.getDay() + 6) % 7)); return iso(x); }
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  };
  const buckets = new Map();
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) {
    const k = keyOf(d);
    if (!buckets.has(k)) {
      const label = mode === 'month'
        ? new Intl.DateTimeFormat('pt-PT', { month: 'short' }).format(d).replace('.', '')
        : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
      buckets.set(k, { label, value: 0, count: 0 });
    }
  }
  done.forEach(r => { const b = buckets.get(keyOf(parseISO(r.date))); if (b) { b.value += +r.price || 0; b.count++; } });
  const list = [...buckets.values()];
  const max = Math.max(...list.map(b => b.value), 1);
  const W = 640, H = 190, top = 10, bottom = 22, left = 4;
  const bw = (W - left) / list.length;
  const every = Math.ceil(list.length / 12);
  const cols = list.map((b, i) => {
    const h = (b.value / max) * (H - top - bottom);
    const x = left + i * bw + bw * 0.15;
    return `<rect class="col" x="${x.toFixed(1)}" y="${(H - bottom - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${Math.max(h, b.value ? 1 : 0).toFixed(1)}" rx="2">
      <title>${esc(b.label)}: ${money(b.value)} (${b.count} serviços)</title></rect>` +
      (i % every === 0 ? `<text class="lbl-axis" x="${(left + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(b.label)}</text>` : '');
  }).join('');
  const label = { day: 'por dia', week: 'por semana', month: 'por mês' }[mode];
  return `<div class="row-between"><h3 style="margin:0">Faturação ${label}</h3><span class="muted small">máx. ${money(max)}</span></div>
    <div class="chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturação ${label}">
      <line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>${cols}</svg></div>`;
}

function drawReport() {
  const base = R.rows.filter(r => (!R.pro || r.pro === R.pro) && (!R.service || r.service === R.service));
  const done = base.filter(r => r.status === 'done');
  const noshow = base.filter(r => r.status === 'noshow');
  const pending = base.filter(r => r.status === 'pending');
  const upcoming = base.filter(r => r.status === 'confirmed');
  const revenue = sum(done, r => r.price);
  const noshowRate = done.length + noshow.length ? noshow.length / (done.length + noshow.length) : 0;
  const clients = new Set(done.map(r => (r.email || r.phone || r.name).toLowerCase())).size;
  const table = base.filter(r => !R.status || r.status === R.status).sort((a, b) => b.start - a.start);

  $('#repBody').innerHTML = `
    <div class="kpis">
      <div class="kpi" data-icon="✅" style="--c:var(--c2)"><span>Realizados</span><b>${done.length}</b><small>${clients} cliente${clients === 1 ? '' : 's'}</small></div>
      <div class="kpi" data-icon="💰" style="--c:var(--c4)"><span>Faturação</span><b>${money(revenue)}</b><small>serviços realizados</small></div>
      <div class="kpi" data-icon="🧾" style="--c:var(--c3)"><span>Valor médio</span><b>${money(done.length ? revenue / done.length : 0)}</b><small>por serviço</small></div>
      <div class="kpi" data-icon="🙈" style="--c:var(--c6)"><span>Faltas</span><b>${noshow.length}</b><small>${(noshowRate * 100).toFixed(0)}% das marcações passadas</small></div>
      <div class="kpi" data-icon="📅" style="--c:var(--c5)"><span>Agendados</span><b>${upcoming.length}</b><small>${money(sum(upcoming, r => r.price))} previstos</small></div>
      <div class="kpi" data-icon="⏳" style="--c:var(--c1)"><span>Pendentes</span><b>${pending.length}</b><small>a aguardar aprovação</small></div>
    </div>
    <section class="card">${timelineHTML(done)}</section>
    <div class="two">
      <section class="card"><h3>Por profissional</h3>${barsHTML(groupBy(done, r => r.pro, r => r.proName))}</section>
      <section class="card"><h3>Por serviço</h3>${barsHTML(groupBy(done, r => r.service, r => r.serviceName))}</section>
    </div>
    <section class="card">
      <div class="row-between" style="margin-bottom:8px"><h3 style="margin:0">Detalhe <span class="muted small">(${table.length})</span></h3>
        <button class="btn sm" id="csv" ${table.length ? '' : 'disabled'}>Exportar CSV</button></div>
      ${table.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th class="num">Valor</th><th>Estado</th></tr></thead>
        <tbody>${table.slice(0, R.limit).map(r => `<tr>
          <td>${fmtDayLong(r.date)}</td><td>${r.time}</td>
          <td>${esc(r.name)}${r.phone ? `<br><span class="muted small">${esc(r.phone)}</span>` : ''}</td>
          <td>${esc(r.serviceName)}</td><td>${esc(r.proName)}</td><td class="num">${money(r.price)}</td><td>${badge(r.status)}</td></tr>`).join('')}
        </tbody></table></div>${table.length > R.limit ? `<p style="text-align:center;margin:12px 0 0"><button class="btn sm" id="more">Mostrar mais (${table.length - R.limit} restantes)</button></p>` : ''}`
        : '<p class="empty">Nada a mostrar com estes filtros.</p>'}
    </section>`;
  const b = $('#csv'); if (b) b.onclick = () => exportCSV(table);
  const m = $('#more'); if (m) m.onclick = () => { R.limit += 100; drawReport(); };
}

function exportCSV(rows) {
  const head = ['Data', 'Hora', 'Fim', 'Cliente', 'Telefone', 'E-mail', 'Serviço', 'Profissional', 'Valor', 'Estado', 'Origem', 'Notas'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [head.join(';'), ...rows.map(r => [
    r.date, r.time, r.endTime, r.name, r.phone, r.email, r.serviceName, r.proName,
    String(r.price).replace('.', ','), STATUS[r.status] || r.status, r.source === 'studio' ? 'Estúdio' : 'Online', r.notes,
  ].map(q).join(';'))];
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `relatorio-${R.from}-a-${R.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderBookings(el) {
  el.innerHTML = `<div class="row-between"><h2>Marcações</h2><button class="btn primary" id="newBk">+ Nova marcação</button></div>

async function loadBookings() {
  const box = $('#bkBody');
  try {
    const t = today(), ti = iso(t);
    const { rows } = await call('listBookings', { from: iso(addDays(t, -7)), to: iso(addDays(t, DATA.settings.maxDaysAhead)) });
    const pending = rows.filter(r => r.status === 'pending');
    const todays = rows.filter(r => r.date === ti && r.status !== 'pending');
    const next = rows.filter(r => r.date > ti && r.status === 'confirmed');
    const past = rows.filter(r => r.date < ti && r.status !== 'pending').reverse();
    const el = $('#pendingCount'); el.hidden = !pending.length; el.textContent = pending.length;
    const sec = (title, list, empty, note = '') => `<section class="card"><div class="row-between"><h3 style="margin:0">${title}
      <span class="muted small">(${list.length})</span></h3>${note ? `<span class="muted small">${note}</span>` : ''}</div>
      <div class="bk-list">${list.length ? list.map(bkItem).join('') : `<p class="empty">${empty}</p>`}</div></section>`;
    box.innerHTML = sec('A aguardar aprovação', pending, 'Sem pedidos pendentes.') +
      sec('Hoje', todays, 'Nada marcado para hoje.') +
      sec('Próximos dias', next, 'Sem marcações futuras.') +
      sec('Últimos 7 dias', past, 'Sem marcações.', 'Marca aqui quem faltou');
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }

function bkItem(r) {
  const a = (act, label, cls = '') => `<button class="btn sm ${cls}" data-act="${act}" data-id="${esc(r.id)}" data-pro="${esc(r.pro)}" data-name="${esc(r.name)}">${label}</button>`;
  const acts = {
    pending: a('approve', 'Aprovar', 'ok') + a('reject', 'Recusar', 'danger'),
    confirmed: a('cancel', 'Cancelar', 'danger'),
    done: a('noshow', 'Faltou'),
    noshow: a('undo', 'Desfazer falta'),
  }[r.status] || '';
  const contact = [r.phone, r.email].filter(Boolean).map(esc).join(' · ');
  return `<div class="bk">
    <div class="bk-when"><b>${r.time}</b><small>${fmtDay(r.date)}</small></div>
    <div class="bk-main"><b>${esc(r.name)}</b> ${badge(r.status)}${r.source === 'studio' ? ' <span class="badge b-off">estúdio</span>' : ''}
      <small>${esc(r.serviceName)} · ${esc(r.proName)} · ${money(r.price)}</small>
      ${contact ? `<small>${contact}</small>` : ''}${r.notes ? `<small>“${esc(r.notes)}”</small>` : ''}</div>
    <div class="bk-act">${acts}</div></div>`;

async function onBookingAction(e) {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const { act, id, pro, name } = b.dataset;
  const status = { approve: 'confirmed', reject: 'rejected', cancel: 'cancelled', noshow: 'noshow', undo: 'confirmed' }[act];
  if (act === 'reject' && !confirm(`Recusar o pedido de ${name}? O cliente é avisado por e-mail.`)) return;
  if (act === 'cancel' && !confirm(`Cancelar a marcação de ${name}? O cliente é avisado por e-mail e o horário fica livre.`)) return;
  b.disabled = true;
  try {
    await call('setStatus', { pro, id, status });
    toast({ approve: 'Aprovada. O cliente recebeu a confirmação.', reject: 'Pedido recusado.', cancel: 'Marcação cancelada.',
            noshow: 'Falta registada.', undo: 'Falta removida.' }[act]);
    R.key = '';
    loadBookings();
  } catch (ex) { toast(ex.message, true); b.disabled = false; }
}

function openBookingDialog() {
  const svcs = DATA.services.filter(s => s.active !== false);
  const form = openDialog(`<h3>Nova marcação</h3>
    <div class="grid2">
      <div class="field"><label>Serviço</label><select name="service">${svcs.map(s => `<option value="${esc(s.id)}">${esc(s.name)} · ${s.duration} min</option>`).join('')}</select></div>
      <div class="field"><label>Profissional</label><select name="pro"></select></div>
      <div class="field"><label>Data</label><input type="date" name="date" value="${iso(today())}"></div>
      <div class="field" data-auto><label>Hora</label><select name="time"></select></div>
      <div class="field" data-manual hidden><label>Hora (manual)</label><input type="time" name="manual" step="300"></div>
    </div>
    <label class="check"><input type="checkbox" name="force"> Outra hora (ignorar disponibilidade e folgas)</label>
    <div class="grid2">
      <div class="field"><label>Nome do cliente</label><input name="name" required maxlength="80"></div>
      <div class="field"><label>Telemóvel</label><input name="phone" type="tel" maxlength="30"></div>
      <div class="field"><label>E-mail (opcional)</label><input name="email" type="email" maxlength="120"></div>
      <div class="field"><label>Notas</label><input name="notes" maxlength="500"></div>
    </div>
    <p class="muted small" style="margin:0">Fica logo confirmada. Se indicares o e-mail, o cliente recebe a confirmação com o ficheiro para o calendário.</p>`,
  async f => {
    const force = f.force.checked;
    const time = force ? f.manual.value : f.time.value;
    if (!f.pro.value) throw new Error('Não há profissionais para este serviço.');
    if (!time) throw new Error('Escolhe uma hora.');
    if (!f.name.value.trim()) throw new Error('Indica o nome do cliente.');
    await call('createBooking', { booking: { service: f.service.value, pro: f.pro.value, date: f.date.value, time, force,
      name: f.name.value, phone: f.phone.value, email: f.email.value, notes: f.notes.value } });
    toast('Marcação criada.'); R.key = '';
    if (TAB === 'bookings') loadBookings();
  }, { saveLabel: 'Criar marcação' });

  const fillPros = () => {
    const pros = DATA.professionals.filter(p => p.active !== false && p.services.includes(form.service.value));
    form.pro.innerHTML = pros.length ? pros.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('') : '<option value="">— nenhum —</option>';
  };
  const fillSlots = async () => {
    form.time.innerHTML = '<option value="">A carregar…</option>';
    if (!form.pro.value || !form.date.value) { form.time.innerHTML = '<option value="">—</option>'; return; }
    try {
      const { slots } = await call('slots', { pro: form.pro.value, service: form.service.value, date: form.date.value });
      form.time.innerHTML = slots.length ? slots.map(t => `<option>${t}</option>`).join('') : '<option value="">Sem horários livres</option>';
    } catch (e) { form.time.innerHTML = `<option value="">${esc(e.message)}</option>`; }
  };
  form.service.onchange = () => { fillPros(); fillSlots(); };
  form.pro.onchange = fillSlots;
  form.date.onchange = fillSlots;
  form.force.onchange = () => { $('[data-auto]', form).hidden = form.force.checked; $('[data-manual]', form).hidden = !form.force.checked; };
  fillPros(); fillSlots();
}

/* =============================== PROFISSIONAIS =============================== */
const hoursText = arr => (arr || []).map(([a, b]) => `${a}-${b}`).join(', ');

function parseHours(txt, day) {
  if (!txt.trim()) return [];
  return txt.split(/[,;]/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(\d{1,2})(?:[:h](\d{2})|h)?\s*[-–]\s*(\d{1,2})(?:[:h](\d{2})|h)?$/i);
    if (!m) throw new Error(`${day}: não percebi "${s}". Usa por exemplo 09:00-13:00, 14:00-19:00`);
    const a = `${pad(+m[1])}:${m[2] || '00'}`, b = `${pad(+m[3])}:${m[4] || '00'}`;
    if (+m[1] > 23 || +m[3] > 24 || a >= b) throw new Error(`${day}: intervalo inválido "${s}".`);
    return [a, b];
  });
}

  ];
  const y = new Date().getFullYear();
  const closedDates = [`${y}-12-25`, `${y + 1}-01-01`];
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const toMin = s => +s.slice(0, 2) * 60 + +s.slice(3);
  const names = ['Joana Martins', 'Pedro Santos', 'Inês Ferreira', 'Tiago Rocha', 'Beatriz Alves', 'Miguel Sousa', 'Carla Pinto',

})();

  const D = demo, clone = o => JSON.parse(JSON.stringify(o));
  const upsert = (list, item) => { const i = list.findIndex(x => x.id === item.id); if (i > -1) list[i] = item; else list.push(item); };
  const slug = (name, list) => { let b = name.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item', id = b, n = 2; while (list.some(x => x.id === id)) id = b + '-' + n++; return id; };
  switch (op) {
    case 'login': return { token: 'demo' };
    case 'changePassword': return { token: 'demo' };
    case 'getAll': return clone({ settings: D.settings, services: D.services, professionals: D.professionals, closedDates: D.closedDates, adminEmail: 'estudio@gmail.com' });
    case 'listBookings':
      return { rows: D.bookings.filter(b => b.date >= p.from && b.date <= p.to && (!p.pro || b.pro === p.pro)).map(demoRow).sort((a, b) => a.start - b.start) };
    case 'setStatus': {
      const i = D.bookings.findIndex(b => b.id === p.id); if (i < 0) throw new Error('Marcação não encontrada.');
      if (p.status === 'rejected' || p.status === 'cancelled') D.bookings.splice(i, 1); else D.bookings[i].status = p.status;
      return { ok: true };
    }
    case 'slots': {
      const pro = D.professionals.find(x => x.id === p.pro), svc = D.services.find(x => x.id === p.service);
      if (D.closedDates.includes(p.date)) return { slots: [] };
      const win = pro.hours[parseISO(p.date).getDay()] || [];
      const busy = D.bookings.filter(b => b.pro === p.pro && b.date === p.date).map(b => [b.startMin, b.startMin + b.dur]);
      D.blocks.filter(k => k.pro === p.pro && p.date >= k.date && p.date <= k.endDate)
        .forEach(k => busy.push(k.allDay ? [0, 1440] : [D.toMin(k.time), D.toMin(k.endTime)]));
      const out = [];
      win.forEach(([a, b]) => { for (let t = D.toMin(a); t + svc.duration <= D.toMin(b); t += D.settings.slotStep)
        if (!busy.some(([s, e]) => t < e && t + svc.duration > s)) out.push(`${pad(Math.floor(t / 60))}:${pad(t % 60)}`); });
      return { slots: out };
    }
    case 'createBooking': {
      const b = p.booking, svc = D.services.find(x => x.id === b.service);
      D.bookings.push({ id: 'b' + Date.now(), pro: b.pro, service: b.service, date: b.date, startMin: D.toMin(b.time), dur: svc.duration,
        price: svc.price, status: 'confirmed', name: b.name, phone: b.phone, email: b.email, notes: b.notes, source: 'studio' });
      return { ok: true, status: 'confirmed' };
    }
    case 'saveService': {
      const s = p.service; if (!s.name.trim()) throw new Error('O serviço precisa de um nome.');
      upsert(D.services, { ...s, id: s.id || slug(s.name, D.services) });
      return { services: clone(D.services) };
    }
    case 'savePro': {
      const x = p.pro, old = D.professionals.find(o => o.id === x.id) || {};
      const item = { ...old, ...x, id: x.id || slug(x.name, D.professionals) };
      let info = '';
      if (item.email && item.sharedWith !== item.email) { item.sharedWith = item.email; info = 'Calendário partilhado com ' + item.email + '.'; }
      upsert(D.professionals, item);
      return { professionals: clone(D.professionals), info };
    }
    case 'saveSettings': Object.assign(D.settings, p.settings); return { settings: clone(D.settings) };
    case 'saveClosed': D.closedDates = [...new Set(p.dates)].sort(); return { closedDates: clone(D.closedDates) };
    case 'listBlocks': {
      const rows = D.blocks.filter(k => k.endDate >= p.from && k.date <= p.to)
        .map(k => ({ ...k, proName: D.professionals.find(x => x.id === k.pro)?.name || k.pro })).sort((a, b) => a.date.localeCompare(b.date));
      return { rows };
    }
    case 'addBlock': {
      const ids = p.pros.includes('*') ? D.professionals.filter(x => x.active !== false).map(x => x.id) : p.pros;
      if (!p.allDay && !(p.start < p.end)) throw new Error('A hora de fim tem de ser depois da hora de início.');
      ids.forEach(id => D.blocks.push({ id: 'k' + Math.random().toString(36).slice(2), pro: id, date: p.from, endDate: p.to, allDay: p.allDay,
        time: p.allDay ? '' : p.start, endTime: p.allDay ? '' : p.end, reason: p.reason || 'Indisponível', managed: true }));
      return { created: ids.length };
    }
    case 'deleteBlock': D.blocks = D.blocks.filter(k => k.id !== p.id); return { ok: true };
    default: throw new Error('Operação desconhecida: ' + op);
  }
}

  $('#demoBanner').hidden = !DEMO_MODE;
  if (DEMO_MODE) { TOKEN = 'demo'; return loadAll(); }
  if (!TOKEN) return showLogin();
  try { await loadAll(); } catch (e) { showLogin(e.message); }
})();
</script>
